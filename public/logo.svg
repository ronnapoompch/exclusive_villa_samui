<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue water gradient to match the original logo -->
    <radialGradient id="waterBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#164e63;stop-opacity:1" />
    </radialGradient>
    
    <!-- Water caustic effect -->
    <filter id="waterCaustics">
      <feTurbulence baseFrequency="0.03 0.02" numOctaves="2" seed="5" />
      <feDisplacementMap in="SourceGraphic" scale="8" />
    </filter>
    
    <!-- Shimmer effect -->
    <filter id="shimmer">
      <feGaussianBlur stdDeviation="1" />
    </filter>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#waterBg)" />
  
  <!-- Water caustic overlay -->
  <circle cx="100" cy="100" r="90" fill="rgba(6, 182, 212, 0.3)" filter="url(#waterCaustics)" opacity="0.7" />
  
  <!-- Animated water ripples -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" opacity="0.8">
    <animate attributeName="r" values="70;75;70" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="50;60;50" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Light reflections -->
  <circle cx="80" cy="70" r="15" fill="rgba(255,255,255,0.2)" filter="url(#shimmer)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="120" cy="85" r="8" fill="rgba(255,255,255,0.15)" filter="url(#shimmer)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Main text -->
  <text x="100" y="75" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="1px">
    EXCLUSIVE
  </text>
  <text x="100" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="2px">
    VILLA
  </text>
  <text x="100" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="3px">
    SAMUI
  </text>
  <text x="100" y="145" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="12" font-style="italic" letter-spacing="1px">
    Thailand
  </text>
  
  <!-- Text glow effect -->
  <text x="100" y="75" text-anchor="middle" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" font-family="Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="1px">
    EXCLUSIVE
  </text>
  <text x="100" y="105" text-anchor="middle" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" font-family="Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="2px">
    VILLA
  </text>
  <text x="100" y="125" text-anchor="middle" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" font-family="Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="3px">
    SAMUI
  </text>
</svg>